name: iOS Build and Test
on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Show environment
      run: |
          echo "Xcode version:"
          xcodebuild -version
          echo "\nAvailable simulators:"
          xcrun simctl list devices available | grep "iPhone"
